services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  app:
    build: .
    image: ${APP_IMAGE:-devops-tasktracker:local}
    environment:
      DATABASE_URL: postgres://tasks:${POSTGRES_PASSWORD:-tasks}@db:5432/tasks
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasks}
      POSTGRES_DB: tasks
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 5s
      retries: 10

volumes:
  db-data:
