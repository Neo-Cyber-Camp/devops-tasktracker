# Securite : sur un depot public, le runner ne s enregistre que si les workflows de TOUS
# les contributeurs externes attendent votre approbation. Lecture faite sur le poste de
# controle avec votre connexion gh (jamais en root), a chaque execution, AVANT toute
# installation : un refus, ou un GitHub qui ne repond pas, ne laisse rien de modifie
# sur la machine. Trois essais espaces de 3 s avant d abandonner.
- name: Lire le reglage d approbation des workflows venant de forks
  ansible.builtin.command:
    argv: [gh, api, "repos/{{ github_owner }}/devops-tasktracker/actions/permissions/fork-pr-contributor-approval",
           --jq, .approval_policy]
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  failed_when: false
  register: fork_approval
  until: fork_approval.rc == 0 or fork_approval.stderr is search('HTTP 40[14]|gh auth login')
  retries: 2
  delay: 3

- name: Arreter si GitHub n a pas donne le reglage
  ansible.builtin.fail:
    msg: >-
      {% if fork_approval.stderr is search('HTTP 404') %}Dépôt {{ github_owner }}/devops-tasktracker introuvable
      (HTTP 404) : vérifiez github_owner dans deploy/group_vars/app.yml, puis relancez le playbook.
      {%- elif fork_approval.stderr is search('HTTP 401|gh auth login') %}gh n'est pas connecté à GitHub :
      lancez atelier-init, puis relancez le playbook.
      {%- else %}GitHub injoignable ou limite atteinte, relancez dans 1 minute
      ({{ (fork_approval.stderr | default('') | trim).splitlines() | last | default('pas de réponse') }}).{% endif %}
  when: fork_approval.rc != 0
  run_once: true

- name: Refuser d enregistrer le runner sans approbation pour tous les contributeurs externes
  ansible.builtin.assert:
    that: (fork_approval.stdout | trim) == 'all_external_contributors'
    fail_msg: >-
      Réglage actuel : {{ fork_approval.stdout | trim }}. Sur GitHub, Settings, Actions, General,
      Approval for running fork pull request workflows from contributors doit valoir
      Require approval for all external contributors avant l'installation du runner (docs/J4.md section 6).
  run_once: true

- name: Installer les bibliotheques dont le runner a besoin
  ansible.builtin.apt:
    name: [libicu72, libkrb5-3, liblttng-ust1, libssl3, zlib1g]
    state: present
    install_recommends: false
    update_cache: true
    cache_valid_time: 3600

- name: Creer l utilisateur du runner (non root, membre du groupe docker)
  ansible.builtin.user:
    name: "{{ runner_user }}"
    groups: docker
    append: true
    shell: /bin/bash

- name: Creer le dossier du runner
  ansible.builtin.file:
    path: "{{ runner_dir }}"
    state: directory
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    mode: "0755"

- name: Telecharger le runner (somme de controle verifiee)
  ansible.builtin.get_url:
    url: "{{ runner_url }}"
    dest: "/tmp/actions-runner-{{ runner_version }}.tar.gz"
    checksum: "sha256:{{ runner_sha256 }}"
    mode: "0644"

- name: Extraire le runner
  ansible.builtin.unarchive:
    src: "/tmp/actions-runner-{{ runner_version }}.tar.gz"
    dest: "{{ runner_dir }}"
    remote_src: true
    owner: "{{ runner_user }}"
    group: "{{ runner_user }}"
    creates: "{{ runner_dir }}/config.sh"

- name: Savoir si le runner est deja enregistre
  ansible.builtin.stat:
    path: "{{ runner_dir }}/.runner"
  register: runner_registered

- name: Exiger le jeton d enregistrement au premier passage
  ansible.builtin.assert:
    that: lookup('env', 'RUNNER_TOKEN') | length > 0
    fail_msg: "RUNNER_TOKEN est vide : voir docs/J4.md, étape Runner"
  when: not runner_registered.stat.exists

# runuser plutot que become_user : pas de fichier temporaire a partager avec un
# utilisateur non privilegie (ansible-core 2.14 sans acl), et jamais root.
# Le jeton passe par ACTIONS_RUNNER_INPUT_TOKEN, que config.sh lit a la place de
# --token puis efface : il n apparait jamais dans la ligne de commande d un
# processus (lisible par tous dans /proc), seulement dans son environnement.
# L URL est construite avec le meme github_owner que la lecture du reglage
# d approbation : le runner ne peut s enregistrer que sur le depot verifie.
# no_log masque toute la sortie de la tache (le jeton est dans son environnement) :
# en cas d echec, la tache de secours donne la ligne d erreur de config.sh, qui ne
# contient pas le jeton (masque quand meme par precaution).
- name: Enregistrer le runner, avec une explication en cas de refus
  block:
    - name: Enregistrer le runner aupres de votre fork
      ansible.builtin.command:
        argv: [runuser, -u, "{{ runner_user }}", --, ./config.sh, --unattended,
               --url, "https://github.com/{{ github_owner }}/devops-tasktracker",
               --name, "{{ runner_name }}", --labels, "{{ runner_labels }}", --replace]
        chdir: "{{ runner_dir }}"
        creates: "{{ runner_dir }}/.runner"
      environment:
        ACTIONS_RUNNER_INPUT_TOKEN: "{{ lookup('env', 'RUNNER_TOKEN') }}"
      no_log: true
      register: runner_config
  rescue:
    - name: Expliquer le refus de config.sh (sans le jeton)
      ansible.builtin.fail:
        msg: >-
          config.sh a refusé l'enregistrement du runner ({{ ((runner_config.stderr_lines | default([]))
          + (runner_config.stdout_lines | default([]))) | map('trim') | select | list | first
          | default('sans message') | replace(lookup('env', 'RUNNER_TOKEN') or 'jeton-absent', '***') }}).
          Cause la plus fréquente : le jeton RUNNER_TOKEN a expiré (il vaut 1 heure). Relancez la commande
          RUNNER_TOKEN=... ansible-playbook de docs/J4.md section 7, qui demande un nouveau jeton.

- name: Installer le service systemd du runner
  ansible.builtin.command:
    cmd: "./svc.sh install {{ runner_user }}"
    chdir: "{{ runner_dir }}"
    creates: "{{ runner_dir }}/.service"

- name: Lire le nom du service
  ansible.builtin.slurp:
    src: "{{ runner_dir }}/.service"
  register: runner_service

- name: Demarrer le service et l activer au boot
  ansible.builtin.systemd:
    name: "{{ runner_service.content | b64decode | trim }}"
    state: started
    enabled: true
